spring.application.name=smart-clinic-back-end

# ---- MySQL (relational data: doctor, patient, appointment) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cms}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- MongoDB (NoSQL data: prescriptions) ----
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/prescriptions}

# ---- JWT ----
jwt.secret=${JWT_SECRET:change-this-super-secret-key-before-deploying}

server.port=8080
